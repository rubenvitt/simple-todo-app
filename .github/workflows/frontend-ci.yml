name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 8
        
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Build shared types
      run: pnpm run build --filter=@simple-todo-app/shared
      
    - name: Run frontend linting
      run: pnpm run lint:check --filter=frontend
      
    - name: Run frontend type checking
      run: pnpm run build --filter=frontend
      
    - name: Run frontend tests with coverage
      run: pnpm run test:coverage --filter=frontend
      
    - name: Upload coverage reports to Codecov
      if: matrix.node-version == '20.x'
      uses: codecov/codecov-action@v4
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
        
    - name: Archive coverage artifacts
      if: matrix.node-version == '20.x'
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage-report
        path: |
          frontend/coverage/
          !frontend/coverage/tmp/
        retention-days: 30
        
    - name: Comment PR with coverage
      if: github.event_name == 'pull_request' && matrix.node-version == '20.x'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          try {
            const coveragePath = path.join('frontend', 'coverage', 'coverage-summary.json');
            const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
            
            const formatPercent = (num) => `${num.toFixed(1)}%`;
            
            const coverageComment = `
          ## 📊 Frontend Test Coverage Report
          
          | Metric | Coverage | Threshold |
          |--------|----------|-----------|
          | **Statements** | ${formatPercent(coverage.total.statements.pct)} | 80% |
          | **Branches** | ${formatPercent(coverage.total.branches.pct)} | 80% |
          | **Functions** | ${formatPercent(coverage.total.functions.pct)} | 80% |
          | **Lines** | ${formatPercent(coverage.total.lines.pct)} | 80% |
          
          ### Status
          ${coverage.total.statements.pct >= 80 ? '✅' : '❌'} **Overall coverage**: ${formatPercent(coverage.total.statements.pct)}
          
          <details>
          <summary>📁 Detailed Coverage by Directory</summary>
          
          | Directory | Statements | Branches | Functions | Lines |
          |-----------|------------|----------|-----------|-------|`;
          
            for (const [file, data] of Object.entries(coverage)) {
              if (file !== 'total' && data.statements) {
                const dir = file.split('/').slice(0, -1).join('/') || file;
                coverageComment += `
          | \`${dir}\` | ${formatPercent(data.statements.pct)} | ${formatPercent(data.branches.pct)} | ${formatPercent(data.functions.pct)} | ${formatPercent(data.lines.pct)} |`;
              }
            }
            
            coverageComment += `
          </details>
          
          > Generated by Frontend CI workflow
          `;
          
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: coverageComment
            });
          } catch (error) {
            console.error('Error reading coverage report:', error);
          }

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 8
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Build shared types
      run: pnpm run build --filter=@simple-todo-app/shared
      
    - name: Build frontend for production
      run: pnpm run build --filter=frontend
      env:
        NODE_ENV: production
        
    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist/
        retention-days: 7

  frontend-security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 8
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Run security audit
      run: pnpm audit --audit-level moderate
      
    - name: Run dependency vulnerability check
      run: pnpm run audit:fix --filter=frontend
      continue-on-error: true